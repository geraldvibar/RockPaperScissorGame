<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Scrissor Paper Game</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1 class="game-title">Rock Paper Scissors</h1>
        <div class="btn-group">
        <button onclick="play('rock')"><img src="images/rock-emoji.png" alt=""></button>
        <button onclick="play('paper')"><img src="images/paper-emoji.png" alt=""></button>
        <button onclick="play('scissors')"><img src="./images/scissors-emoji.png"></button>
        </div>

        <div class="game-result">
            <h2 id="result"></h2>
            <p id="chosen"></p>
            <p id="scores"></p>
            <button onclick="resetScore()">Reset Score</button>
        </div>
    </div>

    <script src="index.js">

    </script>
</body>
</html>
