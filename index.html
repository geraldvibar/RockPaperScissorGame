<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0c1018">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1 class="game-title">Rock Paper Scissors</h1>
        <p class="instructions">Choose your move to start a round</p>
        <div class="btn-group">
        <button type="button" aria-label="Choose rock" onclick="play('rock')"><img src="images/rock-emoji.png" alt=""></button>
        <button type="button" aria-label="Choose paper" onclick="play('paper')"><img src="images/paper-emoji.png" alt=""></button>
        <button type="button" aria-label="Choose scissors" onclick="play('scissors')"><img src="images/scissors-emoji.png" alt=""></button>
        </div>

        <div class="game-result">
            <h2 id="result" aria-live="polite">Ready?</h2>
            <p id="chosen"></p>
            <p id="scores" aria-live="polite"></p>
            <button type="button" onclick="resetScore()">Reset score</button>
        </div>
    </main>

    <script src="index.js">

    </script>
</body>
</html>
